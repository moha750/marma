<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <link rel="icon" type="image/svg+xml" href="../assets/logo-mark.svg">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#0F9D58">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="مَرمى">
  <link rel="apple-touch-icon" href="/assets/pwa/icon.svg">
  <title>تسجيل الدخول - مَرمى</title>
  <!-- مشاركة الروابط (Open Graph + Twitter) -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="مَرمى">
  <meta property="og:locale" content="ar_AR">
  <meta property="og:url" content="https://marma.help/auth/login.html">
  <meta property="og:title" content="مَرمى — كل حجوزاتك .. في مَرمى واحد">
  <meta property="og:description" content="ادخل إلى لوحة تحكّم مَرمى لإدارة حجوزات ملاعبك.">
  <meta property="og:image" content="https://marma.help/assets/og/home.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="مَرمى — نظام حجوزات الملاعب">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="مَرمى — كل حجوزاتك .. في مَرمى واحد">
  <meta name="twitter:description" content="ادخل إلى لوحة تحكّم مَرمى لإدارة حجوزات ملاعبك.">
  <meta name="twitter:image" content="https://marma.help/assets/og/home.png">
  <script>(function(){try{var t=localStorage.getItem('marma:theme')||'system';if(t==='system')t=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';document.documentElement.setAttribute('data-theme',t);}catch(_){document.documentElement.setAttribute('data-theme','light');}})();</script>
  <link rel="stylesheet" href="../styles/main.css">
</head>
<body>
  <div class="auth-page">
    <div class="auth-card">
      <div class="logo">
        <img src="../assets/logo.svg" alt="مَرمى" class="auth-logo" width="64" height="64">
        <h1>تسجيل الدخول</h1>
        <p class="subtitle">أهلاً بعودتك! ادخل بياناتك للوصول إلى ملعبك</p>
      </div>

      <button type="button" class="btn btn--oauth btn--block" id="google-btn">
        <svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.28-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
        المتابعة بحساب Google
      </button>
      <button type="button" class="btn btn--apple btn--block" id="apple-btn" style="margin-top:var(--space-2)">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M17.05 20.28c-.98.95-2.05.8-3.08.35-1.09-.46-2.09-.48-3.24 0-1.44.62-2.2.44-3.06-.35C2.79 15.25 3.51 7.59 9.05 7.31c1.35.07 2.29.74 3.08.8 1.18-.24 2.31-.93 3.57-.84 1.51.12 2.65.72 3.4 1.8-3.12 1.87-2.38 5.98.48 7.13-.57 1.5-1.31 2.99-2.53 4.08zM12.03 7.25c-.15-2.23 1.66-4.07 3.74-4.25.29 2.58-2.34 4.5-3.74 4.25z"/></svg>
        المتابعة بحساب Apple
      </button>
      <div class="auth-divider"><span>أو بالبريد الإلكتروني</span></div>

      <form id="login-form" autocomplete="on">
        <div class="form-group">
          <label class="form-label" for="email">البريد الإلكتروني <span class="required">*</span></label>
          <input type="email" class="form-control" id="email" name="email" required autofocus autocomplete="email">
        </div>
        <div class="form-group">
          <label class="form-label" for="password">كلمة المرور <span class="required">*</span></label>
          <div class="password-field">
            <input type="password" class="form-control" id="password" name="password" required minlength="6" autocomplete="current-password">
            <button type="button" class="password-toggle" aria-label="إظهار كلمة المرور" aria-pressed="false"><i data-lucide="eye-off"></i></button>
          </div>
          <div style="text-align:start;margin-top:var(--space-2)">
            <a href="/auth/forgot" class="text-sm">نسيت كلمة المرور؟</a>
          </div>
        </div>
        <button type="submit" class="btn btn--primary btn--block" id="submit-btn">
          <span class="btn-text">تسجيل الدخول</span>
        </button>
      </form>

      <div class="auth-footer">
        ليس لديك حساب؟ <a href="/auth/signup">أنشئ حساباً جديداً</a>
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../config.js"></script>
  <script src="../src/core/supabase-client.js"></script>
  <script src="../src/core/utils.js"></script>
  <script src="../src/core/analytics.js"></script>
  <script src="../src/core/auth.js"></script>
  <script>
    window.utils.renderIcons();
    window.utils.initPasswordToggles();
    // زر Google
    document.getElementById('google-btn').addEventListener('click', () => window.auth.signInWithGoogle());
    document.getElementById('apple-btn').addEventListener('click', () => window.auth.signInWithApple());
    // إذا كان مسجلاً بالفعل (أو عائدًا من Google)، نلتقط الجلسة ثم نوجّه حسب نوع الحساب
    (async () => {
      await window.auth.handleOAuthCallback();
      await window.auth.redirectIfAuthenticated();
    })();

    const form = document.getElementById('login-form');
    const submitBtn = document.getElementById('submit-btn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = form.email.value.trim();
      const password = form.password.value;
      submitBtn.disabled = true;
      submitBtn.querySelector('.btn-text').textContent = 'جارٍ الدخول...';

      try {
        const { error } = await window.sb.auth.signInWithPassword({ email, password });
        if (error) throw error;
        const dest = await window.auth.getPostLoginDestination();
        if (dest) {
          window.location.replace(dest);
        } else {
          await window.sb.auth.signOut();
          window.utils.toast('حسابك غير مرتبط بأي ملعب', 'error');
          submitBtn.disabled = false;
          submitBtn.querySelector('.btn-text').textContent = 'تسجيل الدخول';
        }
      } catch (err) {
        window.utils.toast(window.utils.formatError(err), 'error');
        submitBtn.disabled = false;
        submitBtn.querySelector('.btn-text').textContent = 'تسجيل الدخول';
      }
    });
  </script>
</body>
</html>
