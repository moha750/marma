<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="../assets/logo-mark.svg">
  <title>إنشاء حساب - مَرمى</title>
  <!-- مشاركة الروابط (Open Graph + Twitter) -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="مَرمى">
  <meta property="og:locale" content="ar_AR">
  <meta property="og:url" content="https://marma.help/auth/signup.html">
  <meta property="og:title" content="سجّل ملعبك الآن — مَرمى">
  <meta property="og:description" content="ابدأ بإدارة حجوزات ملاعبك مع تجربة مجانية ٣ أيام. كل حجوزاتك .. في مَرمى واحد.">
  <meta property="og:image" content="https://marma.help/assets/og/signup.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="سجّل ملعبك الآن مع تجربة مجانية ٣ أيام">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="سجّل ملعبك الآن — مَرمى">
  <meta name="twitter:description" content="ابدأ بإدارة حجوزات ملاعبك مع تجربة مجانية ٣ أيام. كل حجوزاتك .. في مَرمى واحد.">
  <meta name="twitter:image" content="https://marma.help/assets/og/signup.png">
  <script>(function(){try{var t=localStorage.getItem('marma:theme')||'system';if(t==='system')t=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';document.documentElement.setAttribute('data-theme',t);}catch(_){document.documentElement.setAttribute('data-theme','light');}})();</script>
  <link rel="stylesheet" href="../styles/main.css">
</head>
<body>
  <div class="auth-page">
    <div class="auth-card">
      <div class="logo">
        <img src="../assets/logo.svg" alt="مَرمى" class="auth-logo" width="64" height="64">
        <h1 id="page-title">إنشاء حساب جديد</h1>
        <p class="subtitle" id="page-subtitle">سجل ملعبك الآن مع <span style="color:var(--color-success);font-weight:600;">3 أيام تجربة مجانية</span></p>
      </div>

      <div id="invite-info" class="hidden" style="background:var(--color-info-light);border-radius:var(--radius);padding:12px;margin-bottom:16px;font-size:0.9rem;"></div>

      <div id="oauth-section">
        <button type="button" class="btn btn--oauth btn--block" id="google-btn">
          <svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.28-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
          المتابعة بحساب Google
        </button>
        <button type="button" class="btn btn--apple btn--block" id="apple-btn" style="margin-top:var(--space-2)">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M17.05 20.28c-.98.95-2.05.8-3.08.35-1.09-.46-2.09-.48-3.24 0-1.44.62-2.2.44-3.06-.35C2.79 15.25 3.51 7.59 9.05 7.31c1.35.07 2.29.74 3.08.8 1.18-.24 2.31-.93 3.57-.84 1.51.12 2.65.72 3.4 1.8-3.12 1.87-2.38 5.98.48 7.13-.57 1.5-1.31 2.99-2.53 4.08zM12.03 7.25c-.15-2.23 1.66-4.07 3.74-4.25.29 2.58-2.34 4.5-3.74 4.25z"/></svg>
          المتابعة بحساب Apple
        </button>
        <div class="auth-divider"><span>أو بالبريد الإلكتروني</span></div>
      </div>

      <form id="signup-form" autocomplete="on">
        <div class="form-group" id="fullname-group">
          <label class="form-label" for="full_name">اسمك الكامل <span class="required">*</span></label>
          <input type="text" class="form-control" id="full_name" name="full_name" required>
        </div>

        <div class="form-group" id="email-group">
          <label class="form-label" for="email">البريد الإلكتروني <span class="required">*</span></label>
          <input type="email" class="form-control" id="email" name="email" required autocomplete="email">
        </div>

        <div class="form-group">
          <label class="form-label" for="password">كلمة المرور <span class="required">*</span></label>
          <div class="password-field">
            <input type="password" class="form-control" id="password" name="password" required minlength="6" autocomplete="new-password">
            <button type="button" class="password-toggle" aria-label="إظهار كلمة المرور" aria-pressed="false"><i data-lucide="eye-off"></i></button>
          </div>
          <span class="form-help">6 أحرف على الأقل</span>
        </div>

        <button type="submit" class="btn btn--primary btn--block" id="submit-btn">
          <span class="btn-text">إنشاء الحساب</span>
        </button>
      </form>

      <!-- شاشة إدخال رمز التحقق (OTP) — تظهر بعد التسجيل -->
      <div id="confirm-panel" class="auth-confirm hidden">
        <div class="auth-confirm__icon" aria-hidden="true">
          <i data-lucide="shield-check"></i>
        </div>
        <h2 class="auth-confirm__title">أدخل رمز التحقق</h2>
        <p class="auth-confirm__text">
          أرسلنا رمزاً من 6 أرقام إلى
          <strong class="auth-confirm__email" id="confirm-email"></strong>
        </p>
        <form id="otp-form" autocomplete="off">
          <div class="form-group">
            <input type="text" class="form-control otp-input" id="otp-input"
                   inputmode="numeric" autocomplete="one-time-code" maxlength="6"
                   pattern="[0-9]{6}" placeholder="••••••" required aria-label="رمز التحقق">
          </div>
          <p id="confirm-msg" class="auth-confirm__msg hidden" role="status"></p>
          <button type="submit" class="btn btn--primary btn--block" id="verify-btn">
            <span class="btn-text">تأكيد وتفعيل الحساب</span>
          </button>
        </form>
        <div class="auth-confirm__hint">
          لم يصلك الرمز؟ انتظر دقيقة وتفقّد مجلد <strong>الرسائل غير المرغوب فيها (Spam)</strong>.
        </div>
        <div class="auth-confirm__actions">
          <button type="button" class="btn btn--ghost btn--block" id="resend-btn">
            <span class="btn-text">إعادة إرسال الرمز</span>
          </button>
          <button type="button" class="btn btn--ghost btn--block" id="change-email-btn">
            استخدام بريد آخر
          </button>
        </div>
      </div>

      <div class="auth-footer" id="auth-footer">
        لديك حساب بالفعل؟ <a href="/auth/login">سجل دخولك</a>
      </div>
    </div>
  </div>

  <script src="/assets/vendor/lucide.min.js"></script>
  <script src="/assets/vendor/supabase.js"></script>
  <script src="../config.js"></script>
  <!-- جسر البيئة الأصلية (Capacitor) — قبل بقية الكود -->
  <script src="../src/core/native.js"></script>
  <script src="../src/core/supabase-client.js"></script>
  <script src="../src/core/utils.js"></script>
  <script src="../src/core/analytics.js"></script>
  <script src="../src/core/auth.js"></script>
  <!-- signup يحتاج staffApi.getInvitationByCode فقط -->
  <script src="../src/features/staff/api.js"></script>
  <script src="../src/core/api.js"></script>
  <script>
    window.utils.renderIcons();
    window.utils.initPasswordToggles();
    document.getElementById('google-btn').addEventListener('click', () => window.auth.signInWithGoogle());
    document.getElementById('apple-btn').addEventListener('click', () => window.auth.signInWithApple());
    (async () => {
      // التقاط جلسة العودة من Google إن وُجدت، ثم إعادة التوجيه إذا مسجل بالفعل
      await window.auth.handleOAuthCallback();
      const { data: { session } } = await window.sb.auth.getSession();
      if (session) {
        await window.auth.redirectIfAuthenticated();
        return;
      }

      const inviteCode = window.utils.getQueryParam('invite');
      // OAuth للمالك فقط حاليًّا — نُخفي زر Google في تدفّق دعوة الموظف
      if (inviteCode) { const os = document.getElementById('oauth-section'); if (os) os.style.display = 'none'; }
      const form = document.getElementById('signup-form');
      const submitBtn = document.getElementById('submit-btn');
      const inviteInfo = document.getElementById('invite-info');
      const pageTitle = document.getElementById('page-title');
      const pageSubtitle = document.getElementById('page-subtitle');
      const authFooter = document.getElementById('auth-footer');
      const confirmPanel = document.getElementById('confirm-panel');
      const confirmEmail = document.getElementById('confirm-email');
      const resendBtn = document.getElementById('resend-btn');
      const changeEmailBtn = document.getElementById('change-email-btn');
      const confirmMsg = document.getElementById('confirm-msg');
      const otpForm = document.getElementById('otp-form');
      const otpInput = document.getElementById('otp-input');
      const verifyBtn = document.getElementById('verify-btn');
      let inviteData = null;
      let pendingEmail = '';
      let cooldownTimer = null;

      // مؤقّت لمنع إعادة الإرسال المتكرر
      function startResendCooldown(secs) {
        clearInterval(cooldownTimer);
        const label = resendBtn.querySelector('.btn-text');
        let remaining = secs;
        resendBtn.disabled = true;
        label.textContent = `إعادة الإرسال خلال ${remaining}ث`;
        cooldownTimer = setInterval(() => {
          remaining--;
          if (remaining <= 0) {
            clearInterval(cooldownTimer);
            resendBtn.disabled = false;
            label.textContent = 'إعادة إرسال الرمز';
          } else {
            label.textContent = `إعادة الإرسال خلال ${remaining}ث`;
          }
        }, 1000);
      }

      // عرض شاشة إدخال رمز التحقق (OTP) بدل التحويل السريع
      function showConfirmScreen(email) {
        pendingEmail = email;
        confirmEmail.textContent = email;
        form.style.display = 'none';
        authFooter.classList.add('hidden');
        if (inviteInfo) inviteInfo.classList.add('hidden');
        pageSubtitle.classList.add('hidden');
        pageTitle.textContent = 'خطوة أخيرة';
        confirmMsg.classList.add('hidden');
        confirmPanel.classList.remove('hidden');
        window.utils.renderIcons();
        startResendCooldown(60);
        otpInput.value = '';
        setTimeout(() => otpInput.focus(), 100);
        confirmPanel.scrollIntoView({ block: 'center', behavior: 'smooth' });
      }

      // إدخال أرقام فقط في حقل الرمز
      otpInput.addEventListener('input', () => {
        otpInput.value = otpInput.value.replace(/[^0-9]/g, '').slice(0, 6);
      });

      // التحقّق من الرمز وتفعيل الحساب
      otpForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        const token = otpInput.value.trim();
        if (!/^[0-9]{6}$/.test(token)) {
          showConfirmMsg('أدخل رمزاً صحيحاً من 6 أرقام', 'error');
          return;
        }
        verifyBtn.disabled = true;
        verifyBtn.querySelector('.btn-text').textContent = 'جارٍ التحقق...';
        try {
          const { error } = await window.sb.auth.verifyOtp({ email: pendingEmail, token, type: 'signup' });
          if (error) throw error;
          // نجح: الجلسة مفعّلة → للوحة التحكم (شاشة الإعداد تلتقطه للمالك الجديد)
          window.utils.toast('تم تفعيل حسابك 🎉', 'success');
          setTimeout(() => window.location.replace(window.utils.path('/dashboard')), 600);
        } catch (err) {
          showConfirmMsg(window.utils.formatError(err), 'error');
          verifyBtn.disabled = false;
          verifyBtn.querySelector('.btn-text').textContent = 'تأكيد وتفعيل الحساب';
        }
      });

      // الرجوع للنموذج لتصحيح البريد
      changeEmailBtn.addEventListener('click', () => {
        clearInterval(cooldownTimer);
        confirmPanel.classList.add('hidden');
        form.style.display = '';
        authFooter.classList.remove('hidden');
        pageSubtitle.classList.remove('hidden');
        pageTitle.textContent = inviteCode ? 'انضم كموظف' : 'إنشاء حساب جديد';
        submitBtn.disabled = false;
        submitBtn.querySelector('.btn-text').textContent = 'إنشاء الحساب';
        form.email.focus();
        form.email.select();
      });

      // عرض رسالة داخل البطاقة (بدل التوست)
      function showConfirmMsg(text, type) {
        confirmMsg.textContent = text;
        confirmMsg.classList.remove('hidden', 'auth-confirm__msg--error', 'auth-confirm__msg--success');
        confirmMsg.classList.add(type === 'error' ? 'auth-confirm__msg--error' : 'auth-confirm__msg--success');
      }

      // إعادة إرسال رابط التأكيد
      resendBtn.addEventListener('click', async () => {
        if (resendBtn.disabled || !pendingEmail) return;
        resendBtn.disabled = true;
        try {
          const { error } = await window.sb.auth.resend({ type: 'signup', email: pendingEmail });
          if (error) throw error;
          showConfirmMsg('تم إرسال رمز جديد إلى بريدك', 'success');
          startResendCooldown(60);
        } catch (err) {
          showConfirmMsg(window.utils.formatError(err), 'error');
          resendBtn.disabled = false;
        }
      });

      // إذا كان هناك رمز دعوة
      if (inviteCode) {
        try {
          inviteData = await window.api.getInvitationByCode(inviteCode);
          if (!inviteData) {
            inviteInfo.classList.remove('hidden');
            inviteInfo.style.background = 'var(--color-danger-light)';
            inviteInfo.style.color = 'var(--color-danger)';
            inviteInfo.innerHTML = '<strong>رمز الدعوة غير صحيح</strong>';
            form.style.display = 'none';
            return;
          }
          if (!inviteData.is_valid) {
            inviteInfo.classList.remove('hidden');
            inviteInfo.style.background = 'var(--color-warning-light)';
            inviteInfo.style.color = 'var(--color-warning)';
            inviteInfo.innerHTML = '<strong>انتهت صلاحية الدعوة أو تم استخدامها مسبقاً</strong>';
            form.style.display = 'none';
            return;
          }

          // واجهة دعوة موظف
          pageTitle.textContent = 'انضم كموظف';
          pageSubtitle.textContent = `تمت دعوتك للانضمام إلى ${inviteData.tenant_name}`;

          inviteInfo.classList.remove('hidden');
          inviteInfo.innerHTML = `
            <strong>دعوة من ${window.utils.escapeHtml(inviteData.tenant_name)}</strong><br>
            باسم: ${window.utils.escapeHtml(inviteData.full_name)} (${window.utils.escapeHtml(inviteData.email)})
          `;

          // تعبئة البريد والاسم وقفلهما
          form.email.value = inviteData.email;
          form.email.readOnly = true;
          form.full_name.value = inviteData.full_name;
          form.full_name.readOnly = true;
        } catch (err) {
          window.utils.toast(window.utils.formatError(err), 'error');
        }
      }

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        submitBtn.disabled = true;
        submitBtn.querySelector('.btn-text').textContent = 'جارٍ الإنشاء...';

        const email = form.email.value.trim();
        const password = form.password.value;
        const fullName = form.full_name.value.trim();
        const metadata = { full_name: fullName };

        if (inviteCode && inviteData) {
          metadata.invite_code = inviteCode;
        }
        // المالك: بلا tenant_name — يُنشئ منشأته عبر شاشة الإعداد بعد تأكيد البريد والدخول

        try {
          const { data, error } = await window.sb.auth.signUp({
            email,
            password,
            options: { data: metadata }
          });
          if (error) throw error;

          const welcomeMsg = inviteCode ? 'تم إنشاء الحساب بنجاح' : 'مرحباً! لديك 3 أيام تجربة مجانية';
          if (data.session) {
            // تأكيد البريد غير مفعّل: دخول مباشر للوحة التحكم
            window.utils.toast(welcomeMsg, 'success');
            setTimeout(() => window.location.replace(window.utils.path('/dashboard')), 800);
          } else {
            // يحتاج تأكيد البريد: نعرض شاشة ثابتة "تحقّق من بريدك" بدل توست عابر
            showConfirmScreen(email);
          }
        } catch (err) {
          window.utils.toast(window.utils.formatError(err), 'error');
          submitBtn.disabled = false;
          submitBtn.querySelector('.btn-text').textContent = 'إنشاء الحساب';
        }
      });
    })();
  </script>
</body>
</html>
