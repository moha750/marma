<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <link rel="icon" type="image/svg+xml" href="/assets/logo-mark.svg">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#0F9D58">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="مَرمى">
  <link rel="apple-touch-icon" href="/assets/pwa/icon.svg">
  <title>مَرمى</title>
  <script>(function(){try{var t=localStorage.getItem('marma:theme')||'system';if(t==='system')t=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';document.documentElement.setAttribute('data-theme',t);}catch(_){document.documentElement.setAttribute('data-theme','light');}})();</script>
  <link rel="stylesheet" href="/styles/main.css">
  <!-- شبكة أمان: HTML قديم من الكاش يشير إلى ملف أنماط حُذف في النشر الجديد ⇒ صفحة
       بلا أنماط. نكشف غياب أي stylesheet مُطبَّق ونُعيد التحميل مرة واحدة فقط. -->
  <script>addEventListener("load",function(){try{var ok=Array.prototype.some.call(document.styleSheets,function(s){try{return s.cssRules&&s.cssRules.length>0}catch(_){return true}});if(!ok&&!sessionStorage.getItem("marma:css-retry")){sessionStorage.setItem("marma:css-retry","1");location.reload()}}catch(_){}});</script>
</head>
<body>
  <div id="app-root">
    <div class="loader-center" style="min-height:100vh"><div class="loader loader--lg"></div></div>
  </div>

  <script src="/assets/vendor/lucide.min.js"></script>

       على الويب يضبط isNative=false ولا يفعل شيئاً آخر. -->
  <script src="/src/core/native.js"></script>

  <!-- Core infrastructure (الترتيب مهم) -->
  <script src="/src/core/supabase-client.js"></script>
  <script src="/src/core/utils.js"></script>
  <script src="/src/core/image-cropper.js"></script>
  <script src="/src/core/auth.js"></script>
